<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard</title>
  <script type="module" src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <div class="lb-title">Scoreboard</div>
    <p class="lb-sub">SCiUS UBU 12 Orientation Camp</p>

    <div class="tabs">
      <button class="tab active-team" id="tab-team" onclick="showTab('team')">Teams</button>
      <button class="tab" id="tab-house" onclick="showTab('house')">Houses</button>
      <button class="tab" id="tab-ind" onclick="showTab('ind')">Individual</button>
    </div>

    <div id="loading">Loading scores&hellip;</div>

    <div id="board-team" class="board"></div>
    <div id="board-house" class="board"></div>
    <div id="board-ind" class="board"></div>

    <!-- Admin toggle -->
    <button class="admin-toggle" onclick="toggleAdminDrawer()">Admin</button>

    <div id="admin-drawer">
      <div class="drawer-inner">

        <div id="pin-gate">
          <label for="pin-input">Enter PIN:</label>
          <input type="password" id="pin-input" maxlength="8" placeholder="••••"
            onkeydown="if(event.key==='Enter') openAdmin()">
          <button id="pin-submit" onclick="openAdmin()">Unlock</button>
          <span id="pin-error">Incorrect PIN. Try again.</span>
        </div>

        <div id="admin-panel">
          <!-- populated by renderAdmin() -->
          <button class="close-admin-btn" onclick="closeAdmin()">Lock admin</button>
        </div>

      </div>
    </div>

  </div>
</body>

</html>
